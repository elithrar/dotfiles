name: Repos volume script
permissions:
  contents: read
on:
  pull_request:
    paths:
      - install.sh
      - tool-storage.sh
      - setup-tool-storage.sh
      - repos-volume.sh
      - .github/tests/repos-volume.sh
      - .github/workflows/repos-volume.yml
  push:
    paths:
      - install.sh
      - tool-storage.sh
      - setup-tool-storage.sh
      - repos-volume.sh
      - .github/tests/repos-volume.sh
      - .github/workflows/repos-volume.yml
jobs:
  mock-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated command mocks (no native volume operations)
        run: |
          bash -n install.sh
          bash -n setup-tool-storage.sh
          sh -n tool-storage.sh
          bash -n repos-volume.sh
          bash -n .github/tests/repos-volume.sh
          bash .github/tests/repos-volume.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x install.sh setup-tool-storage.sh repos-volume.sh .github/tests/repos-volume.sh
