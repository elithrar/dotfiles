name: Tool storage
permissions:
  contents: read
on:
  pull_request:
    paths:
      - install.sh
      - .zprofile
      - .zshrc
      - .config/dotfiles/*tool-storage*
      - .github/tests/tool-storage.sh
      - .github/workflows/tool-storage.yml
  push:
    paths:
      - install.sh
      - .zprofile
      - .zshrc
      - .config/dotfiles/*tool-storage*
      - .github/tests/tool-storage.sh
      - .github/workflows/tool-storage.yml
jobs:
  migration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          for script in install.sh .config/dotfiles/setup-tool-storage.bash .github/tests/tool-storage.sh; do bash -n "$script"; done
          sh -n .config/dotfiles/tool-storage.sh
          bash .github/tests/tool-storage.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh .config/dotfiles/tool-storage.sh .config/dotfiles/setup-tool-storage.bash .github/tests/tool-storage.sh
