<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Late banner fixture</title>
  <style>
    body { margin: 0; font: 16px system-ui; }
    #promo { height: 0; }
    #promo.loaded { height: 120px; background: #eee; }
    main { min-height: 600px; padding: 16px; }
  </style>
</head>
<body>
  <div id="promo"></div>
  <main><h1>Checkout</h1><p>Review your order.</p><button>Continue</button></main>
  <script>
    setTimeout(() => {
      const promo = document.querySelector('#promo');
      promo.textContent = 'Delivery offer';
      promo.classList.add('loaded');
    }, 1000);
  </script>
</body>
</html>
