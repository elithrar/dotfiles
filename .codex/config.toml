#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6-astra"

# Approve for me: automatically review requests that need approval.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = ":workspace"
web_search = "live"

model_reasoning_effort = "ultra"
model_verbosity = "low"
service_tier = "default"

notify = ["/Users/matt/repos/dotfiles/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[features]
analytics_plan_history = true
enable_request_compression = true
# Use Guardian v2 with the runtime's current reviewer model and policy.
guardian_approval = true
guardianv2 = true
memories = true
prevent_idle_sleep = true

[features.context_management]
experimental_mode = true

[model_providers.cloudflare-ai-gateway]
name = "Cloudflare AI Gateway"
base_url = "http://127.0.0.1:41417/v1"
wire_api = "responses"
supports_websockets = false

[model_providers.cloudflare-ai-gateway.auth]
command = "/bin/sh"
args = ["-c", "exec node \"${CODEX_CF_GATEWAY_ADAPTER:-$HOME/.codex/bin/cloudflare-ai-gateway.js}\""]
timeout_ms = 120000
refresh_interval_ms = 300000

[projects."/Users/matt/repos/dotfiles"]
trust_level = "trusted"

[projects."/Users/matt/repos"]
trust_level = "trusted"

[projects."/Users/matt/repos/offcamber"]
trust_level = "trusted"

[tui]
theme = "orng"
notifications = ["agent-turn-complete", "approval-requested"]
show_tooltips = false
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "current-dir", "project-name", "pull-request-number", "branch-changes", "run-state", "approval-mode", "five-hour-limit", "codex-version", "task-progress"]
terminal_title = ["spinner", "project", "git-branch"]

[tui.keymap.global]
open_transcript = "ctrl-t"

[tui.keymap.composer]
submit = "enter"

[tui.keymap.editor]
insert_newline = "shift-enter"

[tui.keymap.chat]
interrupt_turn = "f12"

[marketplaces.openai-bundled]
last_updated = "2026-06-23T18:37:35Z"
source_type = "local"
source = "/Users/matt/repos/dotfiles/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/matt/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."google-drive@openai-curated-remote"]
enabled = true

[plugins."expedia@openai-curated-remote"]
enabled = false

[plugins."app-6938a94a61d881918ef32cb999ff937c@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

# macOS browser bridge uses the service shipped with the installed ChatGPT app.
[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/matt/repos/dotfiles/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/matt/repos/dotfiles/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"@oai/browser-desktop/service","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/matt/repos/dotfiles/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"

# Mirrored from .config/opencode/opencode.jsonc.
[mcp_servers."chrome-devtools"]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = false

[mcp_servers."cloudflare-api"]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers."cloudflare-docs"]
url = "https://docs.mcp.cloudflare.com/mcp"

# Public, stateless WorkbenchOS Motronic ROM/XDF tools.
[mcp_servers.workbenchos]
url = "https://workbench.questionable.services/mcp"

[mcp_servers."cloudflare-builds"]
url = "https://builds.mcp.cloudflare.com/mcp"
enabled = false

[mcp_servers."cloudflare-observability"]
url = "https://observability.mcp.cloudflare.com/mcp"
enabled = false

# The work-only cf-portal and google-workspace servers are injected by
# .codex/bin/codex whenever that launcher selects the Cloudflare AI Gateway.
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
appearanceLightCodeThemeId = "raycast"
appearanceDarkCodeThemeId = "raycast"
selected-avatar-id = "custom:peewee"
show-context-window-usage = true
followUpQueueMode = "steer"
composerEnterBehavior = "cmdIfMultiline"
dock-icon-preference = "app-default"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
realtimeVoiceScreenContextEnabled = true
codex-micro-lighting-brightness = 30
codex-micro-agent-source = "custom"
dictationDictionary = ["WOT = wide open throttle", "Motronic (Bosch Motronic ECU)"]
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
external-agent-import-sync-enabled = true

[desktop.appearanceLightChromeTheme]
accent = "#ff6363"
contrast = 40
ink = "#030303"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
code = '"Jetbrains Mono"'
ui = "Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#006b4f"
diffRemoved = "#b12424"
skill = "#9a1b6e"

[desktop.appearanceDarkChromeTheme]
accent = "#ff6363"
contrast = 60
ink = "#fefefe"
opaqueWindows = false
surface = "#101010"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Jetbrains Mono"'
ui = "Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#59d499"
diffRemoved = "#ff6363"
skill = "#cf2f98"

[desktop.open-in-target-preferences]
global = "zed"

[desktop.codex-micro-layout]
version = 1
encoderMode = "conversation-scroll"
voiceButtonMode = "realtime"

[desktop.codex-micro-layout.slots]

[desktop.codex-micro-layout.slots.ACT06]
keycapId = "FAST"

[desktop.codex-micro-layout.slots.ACT07]
keycapId = "APPR"

[desktop.codex-micro-layout.slots.ACT08]
keycapId = "REJ"

[desktop.codex-micro-layout.slots.ACT09]
keycapId = "SPLIT"

[desktop.codex-micro-layout.slots.ACT10_ACT11]
keycapId = "MIC"

[desktop.codex-micro-layout.slots.ACT12]
keycapId = "BUG"

[desktop.codex-micro-layout.slots.ACT12.action]
type = "skill"
skillName = "review-agent"
skillPath = "/Users/matt/repos/dotfiles/.codex/skills/.system/review-agent/SKILL.md"

[desktop.codex-micro-layout.analogStick]

[desktop.codex-micro-layout.analogStick.up]
type = "command"
commandId = "composer.togglePlanMode"

[desktop.codex-micro-layout.analogStick.right]
type = "command"
commandId = "navigateForward"

[desktop.codex-micro-layout.analogStick.down]
type = "command"
commandId = "toggleSidebar"

[desktop.codex-micro-layout.analogStick.left]
type = "command"
commandId = "navigateBack"

[notice]
hide_rate_limit_model_nudge = true

[shell_environment_policy]
# Keep stale CI or shell tokens from overriding the authenticated gh keyring.
exclude = ["GH_TOKEN", "GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN", "GITHUB_ENTERPRISE_TOKEN"]

[hooks.state]

[hooks.state."browser@openai-bundled:plugin.json#hooks[0]:stop:0:0"]
trusted_hash = "sha256:317a07045dfc95aef2e80c55428a2f817e2768be867e3b1ef29a73da8636ae7f"
enabled = true
