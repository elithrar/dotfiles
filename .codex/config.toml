# Codex filesystem and network defaults.
# Command prefix allow/prompt/forbid rules live in .codex/rules/default.rules.
[permissions.codex-default]
description = "Workspace editing with secret denies and Git metadata access."
extends = ":workspace"

[permissions.codex-default.workspace_roots]
"/Users/matt/repos" = true

[permissions.codex-default.filesystem]
glob_scan_max_depth = 8

[permissions.codex-default.filesystem.":workspace_roots"]
# The built-in workspace profile protects Git metadata. Trusted repositories
# need it writable for branches, staging, rebases, commits, and worktrees.
".git" = "write"
"**/*.env" = "deny"
# Keep examples readable. Codex deny rules win over allow/read rules, so avoid
# broad `.env.*` denies that would also catch `.env.example`.
"**/*.env.local" = "deny"
"**/*.env.development" = "deny"
"**/*.env.development.local" = "deny"
"**/*.env.test" = "deny"
"**/*.env.test.local" = "deny"
"**/*.env.production" = "deny"
"**/*.env.production.local" = "deny"
"**/*.env.staging" = "deny"
"**/*.env.staging.local" = "deny"
"**/*.env.preview" = "deny"
"**/*.env.preview.local" = "deny"
"**/*.dev.vars" = "deny"

[permissions.codex-default.network]
enabled = true

